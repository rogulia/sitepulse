name: Summary

on:
  schedule:
    - cron: "30 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: rogulia/sitepulse@v1
        with:
          mode: summary
          telegram-token: ${{ secrets.TELEGRAM_TOKEN }}
          telegram-channel-id: ${{ secrets.TELEGRAM_CHANNEL_ID }}
