name: Health

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sitepulse-health
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: rogulia/sitepulse@v1
        with:
          mode: health
          telegram-token: ${{ secrets.TELEGRAM_TOKEN }}
          telegram-channel-id: ${{ secrets.TELEGRAM_CHANNEL_ID }}
